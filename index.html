<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYP Graduation 2026 – Session 11 Prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --surface2: #f2f1ed;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.2);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #a09f9a;
      --teal-bg: #e1f5ee;
      --teal-text: #0f6e56;
      --coral-bg: #faece7;
      --coral-text: #993c1d;
      --blue-bg: #e6f1fb;
      --blue-text: #185fa5;
      --teal-bar: #1d9e75;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252523;
        --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.2);
        --text-primary: #f0efe9;
        --text-secondary: #a09f9a;
        --text-tertiary: #6b6a66;
        --teal-bg: #063a2a;
        --teal-text: #5dcaa5;
        --coral-bg: #3d1a0d;
        --coral-text: #f0997b;
        --blue-bg: #0a2340;
        --blue-text: #85b7eb;
      }
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .clock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .clock {
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    .progress-bg {
      height: 3px;
      background: var(--surface2);
      border-radius: 4px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 3px;
      background: var(--teal-bar);
      border-radius: 4px;
      transition: width 2s linear;
      width: 0%;
    }

    .now-card {
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      cursor: pointer;
      user-select: none;
    }
    .now-card:hover { border-color: var(--teal-text); }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 0.6rem;
      letter-spacing: 0.02em;
    }
    .badge-now    { background: var(--teal-bg);  color: var(--teal-text); }
    .badge-over   { background: var(--coral-bg); color: var(--coral-text); }
    .badge-before { background: var(--blue-bg);  color: var(--blue-text); }

    .now-time  { font-size: 0.78rem; color: var(--text-tertiary); margin-bottom: 3px; }
    .now-title { font-size: 1.2rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem; line-height: 1.35; }
    .now-desc  { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.65; }

    .card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .card-header-row .now-title { flex: 1; }
    .chevron {
      font-size: 1rem;
      color: var(--text-tertiary);
      transition: transform 0.25s ease;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .now-card.expanded .chevron { transform: rotate(180deg); }
    .now-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.65;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin-top 0.2s ease;
      margin-top: 0;
    }
    .now-card.expanded .now-desc {
      max-height: 300px;
      margin-top: 0.5rem;
    }

    .section-label {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      margin-top: 1.5rem;
    }

    .next-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 0.65rem 0.9rem;
      background: var(--surface2);
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      cursor: pointer;
      user-select: none;
      flex-wrap: wrap;
    }
    .next-item:hover { background: var(--border); }

    .next-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex: 1;
    }

    .next-chevron {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      transition: transform 0.2s ease;
      flex-shrink: 0;
      padding-top: 2px;
    }
    .next-item.expanded .next-chevron { transform: rotate(180deg); }

    .next-detail {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.6;
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding-top 0.2s ease;
      padding-top: 0;
      padding-left: calc(52px + 12px);
    }
    .next-item.expanded .next-detail {
      max-height: 200px;
      padding-top: 6px;
    }

    .next-time {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      min-width: 52px;
      padding-top: 1px;
    }

    .next-text {
      font-size: 0.85rem;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .all-done {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: var(--text-tertiary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>NYP Graduation 2026 &mdash; Session 11</h1>
      <p>School of Business Management &middot; 7 May 2026, 5:00 pm &middot; Auditorium</p>
    </header>

    <div class="clock-row">
      <span class="clock" id="clock-display">--:--:--</span>
    </div>

    <div class="progress-bg"><div class="progress-fill" id="progress-bar"></div></div>

    <div class="now-card" id="now-card">
      <div class="badge badge-now" id="current-badge">Now</div>
      <div class="now-time" id="current-time"></div>
      <div class="card-header-row">
        <div class="now-title" id="current-title"></div>
        <span class="chevron">&#8964;</span>
      </div>
      <div class="now-desc" id="current-desc"></div>
    </div>

    <div class="section-label">Coming up</div>
    <div id="next-items"></div>

    <footer>Auto-refreshes every 5 seconds &middot; Times based on your device clock</footer>
  </div>

  <script>
    const items = [
      { time: "15:45", label: "Graduands assemble", desc: "Graduands gather at the Auditorium Pre-Function Room." },
      { time: "16:15", label: "Guests enter & graduands escorted", desc: "Guests enter Auditorium to register and be seated. Graduands escorted from Pre-Function Room to Auditorium in turns." },
      { time: "16:30", label: "Announcement 1 – housekeeping", desc: "Emcee opens: welcome, asks all to switch phones to silent mode. Animation video on diploma collection instructions to be played." },
      { time: "16:30", label: "Arrival of SMM", desc: "School Senior Management to arrive at Auditorium." },
      { time: "16:35", label: "Arrival of Official Procession & AC", desc: "Members of the Official Procession and NYP Advisory Committee arrive." },
      { time: "16:40", label: "Announcement 2 – SDAR souvenir", desc: "Emcee announces the exclusive Teddy Bear souvenir from SDAR and invites graduands to stay connected via alumni channels." },
      { time: "16:45", label: "Arrival of Guest of Honour", desc: "GOH Mr Ho Ren Hua, CEO of Thai Wah Public Company Ltd, arrives." },
      { time: "16:50", label: "All SMM to be seated", desc: "School Senior Management take their seats." },
      { time: "16:50", label: "Announcement 3 – animation video", desc: "Emcee introduces animation video. [Play Animation Video]. Emcee thanks the School of Design and Media students for the video and backdrop." },
      { time: "16:55", label: "Emcee announces Official Procession arriving", desc: "Emcee addresses assembly: GOH and Official Procession arriving shortly. Requests all to rise, then sing National Anthem. DDSBM cues OP to gather at corridor." },
      { time: "16:55", label: "Official Procession gathers outside", desc: "DDSBM informs procession party to get ready and arrange in procession order outside the Auditorium." },
      { time: "17:00", label: "Start of ceremony – Official Procession enters", desc: "Processional music plays. Official Procession enters Auditorium. Members remain standing. National Anthem played. Emcee welcomes all and plays School Video." },
      { time: "17:10", label: "Introduction of Guest of Honour", desc: "Emcee introduces Mr Ho Ren Hua, CEO of Thai Wah Public Company Ltd. GOH invited to stage to deliver speech. A-Team to usher." },
      { time: "17:20", label: "Presentation of Diplomas", desc: "Emcee invites Director of School Ms Doris Teh to present diplomas. Reader calls graduand names by programme: F&B Business, Hospitality & Tourism, Mass Media Management, Sport & Wellness, Business Practice, Correctional & Management Studies, Specialist Diploma in Sport Management & Marketing." },
      { time: "17:50", label: "Presentation of Awards", desc: "Emcee lists donors. GOH invited to present awards. Awards for F&B Business, Hospitality & Tourism, Mass Media Management, Sport & Wellness, and Correctional & Management Studies are presented." },
      { time: "18:10", label: "Graduate Representative's speech", desc: "Hilda Him Rou Hui addresses assembly on behalf of Class of 2026." },
      { time: "18:15", label: "Official Procession departs & closing", desc: "Emcee closes ceremony. Assembly rises as Official Party leaves via left aisle to TFA Function Room for reception. Recessional music plays." },
      { time: "18:20", label: "Post-ceremony announcements", desc: "Emcee: feedback survey, official photographer orders, Career Coaching Booths, light refreshments at NYP Lounge Level 3, photosites around campus." },
      { time: "18:25", label: "Block-by-block dismissal", desc: "Ushers signal emcee. Blocks A → B → C → D → E → F released in sequence from the auditorium." },
    ];

    function toMin(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function fmt12(t) {
      const [h, m] = t.split(":").map(Number);
      const ampm = h >= 12 ? "pm" : "am";
      return `${h % 12 || 12}:${pad(m)} ${ampm}`;
    }

    const startMin = toMin("15:45");
    const endMin   = toMin("18:35");

    function getNow() {
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
    }

    function update() {
      const now = getNow();
      const d = new Date();
      document.getElementById("clock-display").textContent =
        `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

      const pct = Math.max(0, Math.min(100, ((now - startMin) / (endMin - startMin)) * 100));
      document.getElementById("progress-bar").style.width = pct.toFixed(1) + "%";

      let currentIdx = -1;
      for (let i = 0; i < items.length; i++) {
        const iMin   = toMin(items[i].time);
        const nextMin = i + 1 < items.length ? toMin(items[i + 1].time) : endMin;
        if (now >= iMin && now < nextMin) { currentIdx = i; break; }
      }

      const badge = document.getElementById("current-badge");

      if (now < startMin) {
        badge.className = "badge badge-before";
        badge.textContent = "Before start";
        document.getElementById("current-time").textContent = "";
        document.getElementById("current-title").textContent = "Ceremony hasn't started yet";
        document.getElementById("current-desc").textContent = "First item: Graduands assemble at 3:45 pm.";
      } else if (now >= endMin || currentIdx === -1) {
        badge.className = "badge badge-over";
        badge.textContent = "Ceremony ended";
        document.getElementById("current-time").textContent = "";
        document.getElementById("current-title").textContent = "All proceedings complete";
        document.getElementById("current-desc").textContent = "Congratulations to the Class of 2026! 🎓";
      } else {
        const cur = items[currentIdx];
        badge.className = "badge badge-now";
        badge.textContent = "Now";
        document.getElementById("current-time").textContent = fmt12(cur.time);
        document.getElementById("current-title").textContent = cur.label;
        document.getElementById("current-desc").textContent = cur.desc;
      }

      const container = document.getElementById("next-items");
      const upcoming = items.filter(it => toMin(it.time) > now).slice(0, 4);
      const keys = upcoming.map(it => it.time + it.label).join("|");

      if (container.dataset.keys !== keys) {
        container.dataset.keys = keys;
        container.innerHTML = "";
        if (upcoming.length === 0) {
          container.innerHTML = '<div class="all-done">All done — enjoy the reception! 🎉</div>';
        } else {
          upcoming.forEach(it => {
            const el = document.createElement("div");
            el.className = "next-item";
            el.innerHTML = `
              <div class="next-main">
                <div class="next-time">${fmt12(it.time)}</div>
                <div class="next-text">${it.label}</div>
              </div>
              <span class="next-chevron">&#8964;</span>
              <div class="next-detail">${it.desc}</div>`;
            container.appendChild(el);
          });
        }
      }
    }

    document.getElementById("now-card").addEventListener("click", () => {
      document.getElementById("now-card").classList.toggle("expanded");
    });

    document.getElementById("next-items").addEventListener("click", e => {
      const item = e.target.closest(".next-item");
      if (item) item.classList.toggle("expanded");
    });

    update();
    setInterval(update, 5000);
  </script>
</body>
</html>
